  display:flex;align-items:center;justify-content:center;
  font-size:38px;
}
/* ===== LIVE VOICE ANIMATION ===== */

.voice-circle{
  position:relative;
  overflow:visible;
}

/* Outer pulse ring */
.voice-circle::before,
.voice-circle::after{
  content:"";
  position:absolute;
  inset:-12px;
  border-radius:50%;
  border:2px solid rgba(250,204,21,.45);
  opacity:0;
  transform:scale(.6);
}

/* Ring 1 */
.voice-circle::before{
  animation:voicePulse 2.4s ease-out infinite;
}

/* Ring 2 (delayed) */
.voice-circle::after{
  animation:voicePulse 2.4s ease-out infinite;
  animation-delay:1.2s;
}

/* Breathing glow */
.voice-circle.active{
  animation:voiceBreath 1.8s ease-in-out infinite;
  box-shadow:
    0 0 30px rgba(250,204,21,.55),
    0 0 80px rgba(250,204,21,.35);
}

/* ===== KEYFRAMES ===== */

@keyframes voicePulse{
  0%{
    opacity:.7;
    transform:scale(.6);
  }
  100%{
    opacity:0;
    transform:scale(1.6);
  }
}

@keyframes voiceBreath{
  0%{transform:scale(1)}
  50%{transform:scale(1.08)}
  100%{transform:scale(1)}
}

<script>
let micLocked = false;

const userName = localStorage.getItem("gitaUser") || "Seeker";
document.getElementById("welcomeMsg").innerText =
  `Welcome, ${userName}. Speak freely — wisdom begins with honesty.`;

const chat = document.getElementById("chat");
const krishna = document.getElementById("krishna");

let recognition;
let liveMode = false;
let isSpeaking = false;

/* =========================
   TEXT → SPEECH (KRISHNA)
========================= */
function speakKrishna(text){
  micLocked = true;
  isSpeaking = true;

  stopListening();

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "en-IN";
  utter.rate = 0.9;
  utter.pitch = 0.85;

  utter.onend = () => {
    isSpeaking = false;
    micLocked = false;

    if(liveMode){
      startListening();
    }
  };

  speechSynthesis.speak(utter);
}

/* =========================
   ADD MESSAGE TO CHAT
========================= */
function addUserMessage(text){
  chat.innerHTML += `<div class="msg user">${text}</div>`;
  chat.scrollTop = chat.scrollHeight;
}

function addAIMessage(text){
  chat.innerHTML += `<div class="msg ai">${text}</div>`;
  chat.scrollTop = chat.scrollHeight;
}

/* =========================
   AI API CALL
========================= */
async function generateKrishnaReply(userText){
  try{
    const response = await fetch("http://localhost:3000/api/krishna", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: userText })
    });

    const data = await response.json();
    return data.reply;

  }catch(err){
    console.error(err);
    return "Even silence carries wisdom. Try again, seeker.";
  }
}

/* =========================
   LIVE SPEECH LISTENING
========================= */
function startListening(){
  if(isSpeaking || micLocked) return;

  if(!('webkitSpeechRecognition' in window)){
    alert("Speech recognition not supported");
    return;
  }

  if(!recognition){
    recognition = new webkitSpeechRecognition();
    recognition.lang = "en-IN";
    recognition.interimResults = false;
    recognition.continuous = false;

    recognition.onresult = (e) => {
      const userText = e.results[0][0].transcript;

      addUserMessage(userText);

      const typing = document.createElement("div");
      typing.className = "typing";
      typing.innerText = "Krishna is contemplating…";
      chat.appendChild(typing);
      chat.scrollTop = chat.scrollHeight;

      krishna.classList.add("active");

      setTimeout(async () => {
        typing.remove();

        const reply = await generateKrishnaReply(userText);
        addAIMessage(reply);
        speakKrishna(reply);

        setTimeout(() => krishna.classList.remove("active"), 1000);
      }, 1200);
    };

    recognition.onend = () => {
      if(liveMode && !isSpeaking && !micLocked){
        startListening();
      }
    };
  }

  recognition.start();
}

/* =========================
   STOP LISTENING
========================= */
function stopListening(){
  if(recognition){
    recognition.stop();
  }
}

/* =========================
   TOGGLE LIVE MODE
========================= */
function toggleVoiceUI(){
  const voiceUI = document.getElementById("voiceUI");
  const inputRow = document.querySelector(".input-row");
  const btn = document.getElementById("voiceToggle");
  const circle = document.querySelector(".voice-circle");

  liveMode = !liveMode;

  btn.classList.toggle("active", liveMode);
  voiceUI.classList.toggle("active", liveMode);
  inputRow.style.display = liveMode ? "none" : "flex";

  if(liveMode){
    circle.classList.add("active");
    startListening();
  }else{
    circle.classList.remove("active");
    stopListening();
    speechSynthesis.cancel();
  }
}

/* =========================
   TEXT CHAT (NORMAL)
========================= */
async function ask(){
  const q = document.getElementById("q");
  if(!q.value.trim()) return;

  const userText = q.value;
  q.value = "";

  addUserMessage(userText);

  const typing = document.createElement("div");
  typing.className = "typing";
  typing.innerText = "Krishna is contemplating…";
  chat.appendChild(typing);

  krishna.classList.add("active");

  setTimeout(async () => {
    typing.remove();

    const reply = await generateKrishnaReply(userText);
    addAIMessage(reply);

    setTimeout(() => krishna.classList.remove("active"), 1000);
  }, 1200);
}
</script>
<script>
function filterChats(){
  const query = document
    .getElementById("searchChat")
    .value
    .toLowerCase()
    .trim();

  const items = document.querySelectorAll(".history-item");

  items.forEach(item => {
    const text = item.textContent.toLowerCase();

    if(query === ""){
      item.style.display = "block";   // show all when empty
    }
    else if(text.includes(query)){
      item.style.display = "block";   // show ONLY matching
    }
    else{
      item.style.display = "none";    // hide everything else
    }
  });
}
</script>
<script>
/* ===== CHAT HISTORY DATA ===== */
let chats = JSON.parse(localStorage.getItem("gitaChats")) || {};
let currentChat = localStorage.getItem("currentChat") || null;

/* ===== INITIAL LOAD ===== */
function loadChats(){
  const list = document.getElementById("chatList");
  list.innerHTML = "";

  Object.keys(chats).forEach(id=>{
    const div = document.createElement("div");
div.className = "history-item";

div.innerHTML = `
  <span class="chat-title">${chats[id].title}</span>
  <button class="chat-menu" onclick="openChatMenu(event,'${id}')">⋮</button>
`;
    div.onclick = ()=>openChat(id);

    if(id === currentChat) div.classList.add("active");

    list.appendChild(div);
  });
}

/* ===== OPEN CHAT ===== */
function openChat(id){
  currentChat = id;
  localStorage.setItem("currentChat", id);

  chat.innerHTML = "";

  chats[id].messages.forEach(m=>{
    chat.innerHTML +=
      `<div class="msg ${m.role}">${m.text}</div>`;
  });

  chat.scrollTop = chat.scrollHeight;
  loadChats();
}

/* ===== NEW CHAT ===== */
function createNewChat(){
  const id = "chat_" + Date.now();

  chats[id] = {
    title: "New Conversation",
    messages: []
  };

  localStorage.setItem("gitaChats", JSON.stringify(chats));
  openChat(id);
}

/* ===== SAVE MESSAGE ===== */
function saveMessage(role, text){
  if(!currentChat){
    createNewChat();
  }

  chats[currentChat].messages.push({ role, text });

  if(chats[currentChat].messages.length === 1){
    chats[currentChat].title = text.slice(0, 25) + "...";
  }

  localStorage.setItem("gitaChats", JSON.stringify(chats));
  loadChats();
}

/* ===== SEARCH ===== */
function filterChats(){
  const q = document.getElementById("searchChat").value.toLowerCase();
  document.querySelectorAll(".history-item").forEach(item=>{
    item.style.display =
      item.textContent.toLowerCase().includes(q)
      ? "block" : "none";
  });
}

/* ===== HOOK INTO EXISTING CHAT ===== */
const originalAddUser = addUserMessage;
addUserMessage = function(text){
  originalAddUser(text);
  saveMessage("user", text);
};

const originalAddAI = addAIMessage;
addAIMessage = function(text){
  originalAddAI(text);
  saveMessage("ai", text);
};

/* INIT */
loadChats();
</script>
<script>
function startMicOnce(){
  stopListening();
  speechSynthesis.cancel();
  micLocked = false;
  isSpeaking = false;
  liveMode = false;

  if(!('webkitSpeechRecognition' in window)){
    alert("Use Chrome. Speech recognition not supported.");
    return;
  }

  const recog = new webkitSpeechRecognition();
  recog.lang = "en-IN";
  recog.interimResults = false;
  recog.continuous = false;
  recog.maxAlternatives = 1;

  let hasResult = false;

  recog.onstart = () => {
    console.log("🎙️ Mic listening...");
  };

  recog.onresult = async (e) => {
    hasResult = true;

    const userText = e.results[0][0].transcript;
    console.log("🎤 Final text:", userText);

    addUserMessage(userText);

    const typing = document.createElement("div");
    typing.className = "typing";
    typing.innerText = "Krishna is contemplating…";
    chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;

    krishna.classList.add("active");

    const reply = await generateKrishnaReply(userText);
    typing.remove();
    addAIMessage(reply);

    setTimeout(() => krishna.classList.remove("active"), 1000);
  };

  recog.onspeechend = () => {
    console.log("🛑 Speech ended");
    recog.stop();
  };

  recog.onend = () => {
    if(!hasResult){
      console.warn("⚠️ No speech detected");
    }
  };

  recog.onerror = (e) => {
    console.error("❌ Mic error:", e.error);
    alert("Mic error: " + e.error);
  };

  recog.start();
}
</script>
<script>
function openChatMenu(e, chatId){
  e.stopPropagation();

  const confirmDelete = confirm("Delete this chat?");
  if(confirmDelete){
    delete chats[chatId];

    if(chatId === currentChat){
      currentChat = null;
      chat.innerHTML = "";
    }

    localStorage.setItem("gitaChats", JSON.stringify(chats));
    loadChats();
  }
}
</script>
