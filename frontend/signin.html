<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login • GitaAI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",system-ui,sans-serif;
}

/* ===== COLOR THEME ===== */
:root{
  --gold:#facc15;
  --dark:#020617;
  --panel:#071826;
  --input:#0f172a;
  --text:#e5e7eb;
  --muted:#94a3b8;
}

/* ===== BACKGROUND ===== */
body{
  min-height:100vh;
  background:
    radial-gradient(circle at center, rgba(250,204,21,.12), transparent 55%),
    linear-gradient(#020617,#020617);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--text);
  overflow:hidden;
}

/* ===== CARD ===== */
.auth-container{
  width:900px;
  max-width:95%;
  height:460px;
  background:var(--panel);
  border-radius:18px;
  display:flex;
  overflow:hidden;
  box-shadow:0 40px 120px rgba(0,0,0,.9);
  border:1px solid rgba(250,204,21,.25);
  position:relative;
  z-index:5;
}

/* ===== LEFT ===== */
.login-side{
  flex:1;
  padding:60px 50px;
}

.login-side h2{
  font-size:28px;
  margin-bottom:30px;
  color:var(--gold);
}

.field{
  margin-bottom:16px;
}

.field label{
  font-size:13px;
  color:var(--muted);
  margin-bottom:6px;
  display:block;
}

.field input{
  width:100%;
  padding:12px;
  background:var(--input);
  border:none;
  border-radius:10px;
  color:var(--text);
  font-size:15px;
}

.field input:focus{
  outline:none;
  box-shadow:0 0 0 2px rgba(250,204,21,.35);
}

/* ===== FORGOT PASSWORD ===== */
.forgot{
  text-align:right;
  margin-top:6px;
  font-size:13px;
}

.forgot a{
  color:var(--muted);
  text-decoration:none;
}

.forgot a:hover{
  color:var(--gold);
}

/* ===== BUTTON ===== */
.login-btn{
  margin-top:18px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:30px;
  background:linear-gradient(135deg,var(--gold),#f59e0b);
  color:#020617;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
  transition:.25s;
}

.login-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 15px 40px rgba(250,204,21,.45);
}

/* ===== LINKS ===== */
.signup-text{
  margin-top:20px;
  font-size:14px;
}

.signup-text a{
  color:var(--gold);
  text-decoration:none;
}

/* ===== RIGHT PANEL ===== */
.welcome-side{
  flex:1;
  background:linear-gradient(135deg,#3b2f12,#020617);
  clip-path:polygon(20% 0,100% 0,100% 100%,0 100%);
  color:var(--text);
  padding:60px 40px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  border-left:1px solid rgba(250,204,21,.25);
}

.welcome-side h1{
  font-size:32px;
  margin-bottom:18px;
  color:var(--gold);
}

.welcome-side p{
  font-size:15px;
  max-width:260px;
}

/* ===== RESPONSIVE ===== */
@media(max-width:820px){
  .auth-container{
    flex-direction:column;
    height:auto;
  }
  .welcome-side{
    clip-path:none;
  }
}

/* ===== VIDEO BG ===== */
.video-bg{
  position:fixed;
  inset:-20%;
  z-index:1;
  pointer-events:none;
}

.video-bg video{
  width:140%;
  height:140%;
  object-fit:cover;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(0.5);
  opacity:.45;
}
</style>
</head>

<body>

<div class="video-bg">
  <video autoplay muted loop playsinline>
    <source src="./vedio - ROTATE - Videobolt.net.mp4" type="video/mp4">
  </video>
</div>

<div class="auth-container">

  <!-- LOGIN -->
  <div class="login-side">
    <h2>Login</h2>

    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="Enter email">
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password">
    </div>

    <!-- FORGOT PASSWORD -->
    <div class="forgot">
      <a href="forgot-password.html">Forgot password?</a>
    </div>

    <button type="button" class="login-btn" onclick="loginUser()">
      Login
    </button>

    <div class="signup-text">
      Don’t have an account?
      <a href="signup.html">Sign Up</a>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="welcome-side">
    <h1>WELCOME BACK!</h1>
    <p>
      Begin your journey with wisdom, clarity,
      and guidance inspired by the Bhagavad Gita.
    </p>
  </div>

</div>

<script>
async function loginUser(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if(!email || !password){
    alert("Please enter email and password");
    return;
  }

  try{
    const API_BASE = window.location.origin;
    const res = await fetch(API_BASE + "/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if(!res.ok){
      alert(data.detail || "Invalid credentials");
      return;
    }

  if (data.access_token) {
    localStorage.setItem("gitaToken", data.access_token);
    if (data.refresh_token) {
        localStorage.setItem("gitaRefreshToken", data.refresh_token);
    }
    localStorage.setItem("gitaUser", email);
    window.location.replace("dashboard.html");
  } else {
    // ✅ DIRECT REDIRECT (NO POPUP)
    window.location.href = "dashboard.html";
  }
  }catch(error){
    alert("Server not reachable");
    console.error(error);
  }
}

/* ENTER KEY SUPPORT */
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter") loginUser();
});
</script>
</body>
</html>
