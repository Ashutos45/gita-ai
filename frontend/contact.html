<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact • GitaAI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== RESET ===== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",system-ui,sans-serif;
}

/* ===== THEME ===== */
:root{
  --gold:#facc15;
  --dark:#020617;
  --panel:#0f172a;
  --muted:#94a3b8;
}

/* ===== BACKGROUND ===== */
body{
  min-height:100vh;
  background:
    radial-gradient(circle at top,rgba(250,204,21,.08),transparent 40%),
    linear-gradient(rgba(2,6,23,.95),rgba(2,6,23,.95)),
    url("./mahabharata-silhouette-symbol-icon-great-hindu-mythology-96933694.webp");
  background-size:cover;
  background-position:center;
  color:#e5e7eb;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

/* ===== CARD ===== */
.contact-card{
  width:480px;
  max-width:100%;
  background:rgba(2,6,23,.92);
  border-radius:26px;
  padding:34px;
  box-shadow:
    0 40px 120px rgba(0,0,0,.8),
    inset 0 0 0 1px rgba(250,204,21,.15);
  position:relative;
}

/* subtle divine glow */
.contact-card::before{
  content:"";
  position:absolute;
  inset:-1px;
  border-radius:26px;
  background:linear-gradient(
    135deg,
    transparent 30%,
    rgba(250,204,21,.25),
    transparent 70%
  );
  opacity:.4;
  pointer-events:none;
}

/* ===== HEADER ===== */
h1{
  text-align:center;
  color:var(--gold);
  font-size:26px;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  font-size:14px;
  color:var(--muted);
  margin-bottom:28px;
  line-height:1.6;
}

/* ===== FORM ===== */
label{
  font-size:12px;
  color:var(--muted);
  display:block;
  margin-bottom:6px;
}

input, textarea{
  width:100%;
  padding:14px;
  border-radius:16px;
  border:none;
  background:#0f172a;
  color:white;
  margin-bottom:18px;
  font-size:14px;
}

input:focus,
textarea:focus{
  outline:none;
  box-shadow:0 0 0 2px rgba(250,204,21,.25);
}

textarea{
  height:130px;
  resize:none;
}

/* ===== BUTTON ===== */
button{
  width:100%;
  padding:15px;
  border-radius:18px;
  border:none;
  background:linear-gradient(135deg,var(--gold),#f59e0b);
  color:#020617;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
  transition:.3s ease;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 40px rgba(250,204,21,.4);
}

/* ===== FOOTER ===== */
.footer{
  margin-top:22px;
  text-align:center;
  font-size:13px;
  color:var(--muted);
}

.footer a{
  color:var(--gold);
  text-decoration:none;
}

.footer a:hover{
  text-decoration:underline;
}

/* ===== BACK BUTTON ===== */
.back-btn{
  position:absolute;
  top:18px;
  left:18px;
  background:#1e293b;
  color:var(--gold);
  border:none;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:18px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="contact-card">

  <button class="back-btn" onclick="location.href='dashboard.html'">←</button>

  <h1>Contact GitaAI</h1>
  <p class="subtitle">
    Every question matters.  
    Share your thoughts, feedback, or ideas with us.
  </p>

  <label>Your Name</label>
  <input type="text" placeholder="Enter your name">

  <label>Email Address</label>
  <input type="email" placeholder="you@example.com">

  <label>Your Message</label>
  <textarea placeholder="Write your message here..."></textarea>

  <button>Send Message</button>

  <div class="footer">
    “Wisdom begins with a question.”  
    <br>
    <a href="dashboard.html">Back to Dashboard</a>
  </div>

</div>

</body>
</html>
