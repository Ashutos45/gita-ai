<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up • GitaAI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",system-ui,sans-serif;
}

:root{
--gold:#facc15;
--dark:#020617;
--panel:#071826;
--input:#0f172a;
--text:#e5e7eb;
--muted:#94a3b8;
--green:#22c55e;
--red:#ef4444;
}

body{
min-height:100vh;
background:#020617;
display:flex;
align-items:center;
justify-content:center;
color:var(--text);
overflow:hidden;
}

.video-bg{
position:fixed;
inset:-20%;
z-index:1;
pointer-events:none;
}

.video-bg video{
width:140%;
height:140%;
object-fit:cover;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(.5);
opacity:.45;
}

.auth-container{
width:900px;
max-width:96%;
background:rgba(7,24,38,.95);
border-radius:18px;
display:flex;
overflow:hidden;
box-shadow:0 40px 120px rgba(0,0,0,.9);
border:1px solid rgba(250,204,21,.25);
z-index:5;
backdrop-filter:blur(10px);
}

.login-side{
flex:1;
padding:60px 50px;
}

.login-side h2{
font-size:30px;
margin-bottom:30px;
color:var(--gold);
}

.field{
margin-bottom:18px;
}

.field label{
font-size:13px;
color:var(--muted);
margin-bottom:6px;
display:block;
}

.field input{
width:100%;
padding:13px;
background:var(--input);
border:none;
border-radius:10px;
color:var(--text);
outline:none;
transition:.2s;
}

.field input:focus{
border:1px solid var(--gold);
}

.login-btn{
width:100%;
padding:14px;
border:none;
border-radius:30px;
background:linear-gradient(135deg,var(--gold),#f59e0b);
font-weight:800;
cursor:pointer;
margin-top:10px;
transition:.3s;
}

.login-btn:hover{
transform:scale(1.02);
}

.login-btn.loading{
opacity:.6;
pointer-events:none;
}

.signup-text{
margin-top:18px;
font-size:14px;
}

.signup-text a{
color:var(--gold);
text-decoration:none;
}

.welcome-side{
flex:1;
background:linear-gradient(135deg,#3b2f12,#020617);
color:var(--text);
padding:60px 40px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

.welcome-side h1{
font-size:42px;
margin-bottom:10px;
}

@media(max-width:820px){
.auth-container{
flex-direction:column;
}
}

.popup{
position:fixed;
top:30px;
right:30px;
background:#0f172a;
padding:16px 20px;
border-radius:12px;
box-shadow:0 10px 40px rgba(0,0,0,.6);
display:flex;
align-items:center;
gap:10px;
transform:translateX(400px);
opacity:0;
transition:.4s;
z-index:999;
border-left:4px solid var(--gold);
}

.popup.show{
transform:translateX(0);
opacity:1;
}

.popup.success{
border-left-color:var(--green);
}

.popup.error{
border-left-color:var(--red);
}

.popup span{
font-size:14px;
}

</style>
</head>

<body>

<div class="video-bg">
<video autoplay muted loop playsinline>
<source src="./vedio - ROTATE - Videobolt.net.mp4" type="video/mp4">
</video>
</div>

<div class="auth-container">

<div class="login-side">

<h2>Create Account</h2>

<div class="field">
<label>Full Name</label>
<input type="text" id="name" placeholder="Enter your name">
</div>

<div class="field">
<label>Email</label>
<input type="email" id="email" placeholder="Enter email">
</div>

<div class="field">
<label>Password</label>
<input type="password" id="password" placeholder="Create password">
</div>

<div class="field">
<label>Confirm Password</label>
<input type="password" id="confirmPassword" placeholder="Confirm password">
</div>

<button type="button" id="signupBtn" class="login-btn" onclick="signupUser(event)">
Sign Up
</button>

<div class="signup-text">
Already have an account?
<a href="signin.html">Login</a>
</div>

</div>

<div class="welcome-side">
<div>
<h1 style="color:#facc15">WELCOME</h1>
<p>Begin your journey with wisdom from the Bhagavad Gita.</p>
</div>
</div>

</div>

<div id="popup" class="popup">
<span id="popupText"></span>
</div>

<script>

function showPopup(message,type="success"){

const popup=document.getElementById("popup");
const text=document.getElementById("popupText");

text.innerText=message;

popup.className="popup show "+type;

setTimeout(()=>{
popup.classList.remove("show");
},3500);

}

async function signupUser(e){

e.preventDefault();

const name=document.getElementById("name").value.trim();
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value.trim();
const confirmPassword=document.getElementById("confirmPassword").value.trim();
const btn=document.getElementById("signupBtn");

if(!name||!email||!password||!confirmPassword){
showPopup("Please fill all fields","error");
return;
}

if(password!==confirmPassword){
showPopup("Passwords do not match","error");
return;
}

btn.classList.add("loading");
btn.innerText="Creating Account...";

try{

const API_BASE = window.location.origin;
const response = await fetch(API_BASE + "/auth/signup", {
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
full_name:name,
email:email,
password:password
})
});

const result=await response.json();

console.log("Signup result:",result);

if(response.ok){

showPopup("Signup successful!","success");


localStorage.setItem("gitaToken", result.access_token || "temp-user");
if (result.refresh_token) {
    localStorage.setItem("gitaRefreshToken", result.refresh_token);
}



window.location.href = "dashboard.html";


return;

}else{

let message="Signup failed";

if(result.detail){

if(typeof result.detail==="string"){
message=result.detail;
}

else if(Array.isArray(result.detail)){
message=result.detail[0]?.msg||message;
}

else{
message=JSON.stringify(result.detail);
}

}

showPopup(message,"error");

}

}catch(error){

console.error(error);
showPopup("Backend not reachable","error");

}

btn.classList.remove("loading");
btn.innerText="Sign Up";

}

</script>

</body>
</html>
