/* ===== KRISHNA ===== */

  right:28px;

#krishna img{width:100%;border-radius:14px;filter:drop-shadow(0 30px 80px rgba(250,204,21,.45));}

/* ===== VOICE UI ===== */

  justify-content:center;
}
#voiceUI.active{display:flex;}

.voice-card{
  width:360px;
  padding:40px 30px;
  text-align:center;
  border-radius:24px;
  background:linear-gradient(#f6e7c6,#ecd9a4);
}
.voice-circle{
  width:96px;height:96px;margin:0 auto 20px;border-radius:50%;
  background:rgba(250,204,21,.25);
  display:flex;align-items:center;justify-content:center;
  font-size:38px;
}
/* ===== LIVE VOICE ANIMATION ===== */

.voice-circle{
  position:relative;
  overflow:visible;
}

/* Outer pulse ring */
.voice-circle::before,
.voice-circle::after{
  content:"";
  position:absolute;
  inset:-12px;
  border-radius:50%;
  border:2px solid rgba(250,204,21,.45);
  opacity:0;
  transform:scale(.6);
}

/* Ring 1 */
.voice-circle::before{
  animation:voicePulse 2.4s ease-out infinite;
}

/* Ring 2 (delayed) */
.voice-circle::after{
  animation:voicePulse 2.4s ease-out infinite;
  animation-delay:1.2s;
}

/* Breathing glow */
.voice-circle.active{
  animation:voiceBreath 1.8s ease-in-out infinite;
  box-shadow:
    0 0 30px rgba(250,204,21,.55),
    0 0 80px rgba(250,204,21,.35);
}

/* ===== KEYFRAMES ===== */

@keyframes voicePulse{
  0%{
    opacity:.7;
    transform:scale(.6);
  }
  100%{
    opacity:0;
    transform:scale(1.6);
  }
}

@keyframes voiceBreath{
  0%{transform:scale(1)}
  50%{transform:scale(1.08)}
  100%{transform:scale(1)}
}

<script>
let liveMode = false;
let micLocked = false;

const userName = localStorage.getItem("gitaUser") || "Seeker";
document.getElementById("welcomeMsg").innerText =
  `Welcome, ${userName}. Speak freely — wisdom begins with honesty.`;

const chat = document.getElementById("chat");
const krishna = document.getElementById("krishna");

/* Show dismissible voice status bar — does NOT add to chat history */
function showVoiceError(msg) {
  const bar = document.getElementById("voiceStatus");
  const txt = document.getElementById("voiceStatusText");
  if (bar && txt) {
    txt.textContent = msg;
    bar.style.display = "block";
    setTimeout(() => { bar.style.display = "none"; }, 5000);
  }
}


/* =========================
   TEXT → SPEECH (KRISHNA)
========================= */

/* =========================
   ADD MESSAGE TO CHAT
========================= */
function addUserMessage(text){
  const div = document.createElement("div");
  div.className = "msg user";
  div.textContent = text; // Safe against XSS
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
function addAIMessage(text){
  const div = document.createElement("div");
  div.className = "msg ai";
  div.innerHTML = text; // Content contains pre-formatted HTML elements
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

/* =========================
   AI API CALL
========================= */
const API_BASE = window.location.origin;

// Auth is handled by auth.js now.
// Auth is handled by auth.js now.
async function ensureLogin() {
  if (!getAccessToken()) {
    throw new Error("Authentication required.");
  }
}

/* =========================
   TEXT CHAT (NORMAL & STREAMING)
========================= */
let ws = null;
let currentAIMsgDiv = null;
let streamedHTML = "";
let useWebSocket = true;

async function ask(){
  const q = document.getElementById("q");
  if(!q.value.trim()) return;

  const userText = q.value;
  q.value = "";

  addUserMessage(userText);
  saveMessage(currentChat, "user", userText);

  // Show thinking indicator
  const typing = document.createElement("div");
  typing.className = "typing";
  typing.id = "typingIndicator";
  typing.innerText = "Krishna is reflecting…";
  chat.appendChild(typing);
  chat.scrollTop = chat.scrollHeight;

  krishna.classList.add("active");

  if (!useWebSocket) {
      fallbackToHTTP(userText);
      return;
  }

  // Open WebSocket connection
  const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
  console.log("[WebSocket] Connecting to", `${protocol}//${window.location.host}/chat/ws`);
  const wsUrl = `${protocol}//${window.location.host}/chat/ws?token=${getAccessToken()}`;
  
  ws = new WebSocket(wsUrl);
  streamedHTML = "";
  currentAIMsgDiv = null;
  
  // Handle Voice Mode states
  const voiceStatus = document.getElementById("voiceOverlayStatus");
  const voiceCircle = document.getElementById("voiceCircleIndicator");

  ws.onopen = () => {
      ws.send(JSON.stringify({ text: userText }));
      if (liveMode && voiceStatus) {
          voiceStatus.innerText = "Krishna is reflecting...";
          if (voiceCircle) voiceCircle.style.animation = "none";
      }
  };
  
  ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      
      if (data.type === "verse_data") {
          const ti = document.getElementById("typingIndicator");
          if (ti) ti.remove();
          
          currentAIMsgDiv = document.createElement("div");
          currentAIMsgDiv.className = "msg ai";
          chat.appendChild(currentAIMsgDiv);
          
          if (liveMode && voiceStatus) {
              voiceStatus.innerText = "Krishna is speaking...";
              if (voiceCircle) voiceCircle.style.animation = "pulse 1.6s infinite";
          }
          
      } else if (data.type === "chunk") {
          if (currentAIMsgDiv) {
              streamedHTML += data.text;
              currentAIMsgDiv.innerHTML = streamedHTML;
              chat.scrollTop = chat.scrollHeight;
          }
      } else if (data.type === "end") {
          setTimeout(() => krishna.classList.remove("active"), 1000);
          saveMessage(currentChat, "ai", streamedHTML);
          
          if (liveMode) {
              const tempDiv = document.createElement("div");
              tempDiv.innerHTML = streamedHTML;
              const textToSpeak = tempDiv.innerText || tempDiv.textContent || "";
              
              if (voiceStatus) voiceStatus.innerText = "Listening...";
              speakWisdom(textToSpeak, () => {
                  startSpeechRec();
              });
          }
          ws.close();
      }
  };
  
  ws.onerror = (err) => {
      console.error("[WebSocket] Connection failed. Falling back to HTTP.", err);
      const ti = document.getElementById("typingIndicator");
      if (ti) ti.remove();
      
      useWebSocket = false;
      ws.close();
      
      // Re-trigger the same question using HTTP Fallback
      fallbackToHTTP(userText);
  };
}

async function fallbackToHTTP(text) {
  const typing = document.createElement("div");
  typing.className = "typing";
  typing.id = "typingIndicator";
  typing.innerText = "Krishna is reflecting…";
  chat.appendChild(typing);
  chat.scrollTop = chat.scrollHeight;
  krishna.classList.add("active");

  try {
      const res = await fetch("/chat/send?token=" + getAccessToken(), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text })
      });
      
      const ti = document.getElementById("typingIndicator");
      if (ti) ti.remove();
      krishna.classList.remove("active");
      
      if (!res.ok) throw new Error("HTTP fallback failed");
      const data = await res.json();
      
      let html = "";
      for (const msg of data.responses) {
          if (msg.event === "verse" && msg.sanskrit) {
              html += `<div class="verse-card"><div class="sanskrit">${msg.sanskrit}</div><div class="meaning">${msg.meaning}</div></div>`;
          }
          if (msg.event === "text") {
              html += marked.parse(msg.text);
          }
      }
      
      addAIMessage(html);
      saveMessage(currentChat, "ai", html);
  } catch (err) {
      console.error(err);
      const ti = document.getElementById("typingIndicator");
      if (ti) ti.remove();
      krishna.classList.remove("active");
      addAIMessage("⚠ Connection to wisdom failed. Both WebSockets and HTTP routes are unreachable.");
  }
}
</script>

<script>
/* ===== CHAT HISTORY — FIXED ===== */

let chats = JSON.parse(localStorage.getItem("gitaChats")) || {};

// Auto-create a chat session on load so saveMessage never triggers openChat mid-flow
let currentChat = localStorage.getItem("currentChat") || null;
if (!currentChat || !chats[currentChat]) {
  currentChat = "chat_" + Date.now();
  chats[currentChat] = { title: "New Conversation", messages: [] };
  localStorage.setItem("gitaChats", JSON.stringify(chats));
  localStorage.setItem("currentChat", currentChat);
}

/* ===== RENDER SIDEBAR LIST ===== */
function loadChats() {
  const list = document.getElementById("chatList");
  list.innerHTML = "";

  Object.keys(chats).forEach(id => {
    const div = document.createElement("div");
    div.className = "history-item" + (id === currentChat ? " active" : "");

    const titleSpan = document.createElement("span");
    titleSpan.className = "chat-title";
    titleSpan.textContent = chats[id].title;  // textContent — safe

    const menuBtn = document.createElement("button");
    menuBtn.className = "chat-menu";
    menuBtn.textContent = "⋮";
    menuBtn.onclick = (e) => openChatMenu(e, id);

    div.appendChild(titleSpan);
    div.appendChild(menuBtn);
    div.onclick = () => switchToChat(id);

    list.appendChild(div);
  });
}

/* ===== SWITCH TO A DIFFERENT CHAT (replays history) ===== */
function switchToChat(id) {
  if (id === currentChat) return;   // already here — don't wipe
  currentChat = id;
  localStorage.setItem("currentChat", id);

  // Replay saved messages into the chat area
  chat.innerHTML = "";
  chats[id].messages.forEach(m => {
    const div = document.createElement("div");
    div.className = "msg " + m.role;
    div.innerHTML = m.text;  // HTML content (AI messages contain markup)
    chat.appendChild(div);
  });

  chat.scrollTop = chat.scrollHeight;
  loadChats();
}

/* ===== OPEN CHAT (alias kept for menu buttons) ===== */
function openChat(id) { switchToChat(id); }

/* ===== NEW CHAT ===== */
function createNewChat() {
  const id = "chat_" + Date.now();
  chats[id] = { title: "New Conversation", messages: [] };
  currentChat = id;
  localStorage.setItem("gitaChats", JSON.stringify(chats));
  localStorage.setItem("currentChat", id);

  // Clear chat area for fresh session — user explicitly requested new chat
  chat.innerHTML = "";
  const welcome = document.createElement("div");
  welcome.className = "msg ai";
  welcome.id = "welcomeMsg";
  welcome.textContent = "Welcome, " + (localStorage.getItem("gitaUser") || "Seeker") + ". Speak freely — wisdom begins with honesty.";
  chat.appendChild(welcome);

  loadChats();
}

/* ===== SAVE MESSAGE (never touches chat area DOM) ===== */
function saveMessage(role, text) {
  if (!chats[currentChat]) {
    chats[currentChat] = { title: "New Conversation", messages: [] };
  }

  // Strip HTML for storage title
  const plainText = text.replace(/<[^>]*>/g, "").trim();

  chats[currentChat].messages.push({ role, text });

  // Set title from first user message
  if (chats[currentChat].messages.length === 1 && role === "user") {
    chats[currentChat].title = plainText.slice(0, 28) + (plainText.length > 28 ? "…" : "");
  }

  localStorage.setItem("gitaChats", JSON.stringify(chats));
  loadChats();
}

/* ===== HOOK INTO CHAT FUNCTIONS ===== */
const originalAddUser = addUserMessage;
addUserMessage = function(text) {
  originalAddUser(text);
  saveMessage("user", text);
};

const originalAddAI = addAIMessage;
addAIMessage = function(text) {
  originalAddAI(text);
  saveMessage("ai", text);
};

/* INIT */
document.addEventListener("DOMContentLoaded", function () {
    requireAuth(() => {
        loadChats();
    });
});
</script>

<script>
let recognition = null;
let isSpeechRecActive = false;
let synth = window.speechSynthesis;
let currentUtterance = null;

// Initialize Speech Recognition
function getSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return null;
  
  const rec = new SpeechRecognition();
  rec.continuous = false;
  rec.interimResults = false;
  rec.lang = localStorage.getItem("gitaLanguage") || "en-IN";
  
  rec.onstart = () => {
    isSpeechRecActive = true;
    console.log("Web Speech: Listening...");
    const voiceCircle = document.querySelector(".voice-circle");
    if (voiceCircle) voiceCircle.classList.add("active");
  };
  
  rec.onresult = async (event) => {
    const text = event.results[0][0].transcript;
    console.log("Web Speech: Transcribed:", text);
    
    // Add user message
    addUserMessage(text);
    
    const typing = document.createElement("div");
    typing.className = "typing";
    typing.innerText = "Krishna is contemplating…";
    chat.appendChild(typing);
    krishna.classList.add("active");
    
    try {
      const replyHtml = await generateKrishnaReply(text);
      typing.remove();
      addAIMessage(replyHtml);
      
      // Parse plain text for speech synthesis
      const tempDiv = document.createElement("div");
      tempDiv.innerHTML = replyHtml;
      const textToSpeak = tempDiv.innerText || tempDiv.textContent || "";
      
      speakWisdom(textToSpeak, () => {
        if (liveMode) {
          startSpeechRec();
        }
      });
    } catch (err) {
      typing.remove();
      console.error(err);
      showVoiceError("Wisdom retrieval failed. Please try again.");
      if (liveMode) {
        setTimeout(startSpeechRec, 2000);
      }
    }
  };
  
  rec.onerror = (event) => {
    console.error("Web Speech error:", event.error);
    if (event.error === 'no-speech') {
      if (liveMode) startSpeechRec();
      return;
    }
    showVoiceError("Microphone issue: " + event.error);
    isSpeechRecActive = false;
    const voiceCircle = document.querySelector(".voice-circle");
    if (voiceCircle) voiceCircle.classList.remove("active");
  };
  
  rec.onend = () => {
    isSpeechRecActive = false;
    const voiceCircle = document.querySelector(".voice-circle");
    if (voiceCircle) voiceCircle.classList.remove("active");
    console.log("Web Speech: Stopped.");
  };
  
  return rec;
}

function startSpeechRec() {
  if (!recognition) {
    recognition = getSpeechRecognition();
  }
  if (recognition && !isSpeechRecActive) {
    try {
      recognition.start();
    } catch (e) {
      console.error("Failed to start SpeechRecognition:", e);
    }
  }
}

function stopSpeechRec() {
  if (recognition && isSpeechRecActive) {
    try {
      recognition.stop();
    } catch (e) {
      console.error(e);
    }
  }
  if (synth) {
    synth.cancel();
  }
}

function speakWisdom(text, onEndCallback) {
  if (!synth) {
    if (onEndCallback) onEndCallback();
    return;
  }
  synth.cancel();
  
  // Clean up text
  let cleanText = text.replace(/ॐ/g, "").replace(/⚠/g, "").replace(/✕/g, "").trim();
  
  const utterance = new SpeechSynthesisUtterance(cleanText);
  currentUtterance = utterance;
  
  const voices = synth.getVoices();
  const matchedVoice = voices.find(v => v.lang.includes("en-IN")) || 
                        voices.find(v => v.lang.includes("en-GB")) ||
                        voices.find(v => v.lang.includes("en-US")) || 
                        voices[0];
                        
  if (matchedVoice) {
    utterance.voice = matchedVoice;
  }
  
  utterance.onend = () => {
    if (onEndCallback) onEndCallback();
  };
  
  utterance.onerror = (e) => {
    console.error("TTS synthesis error:", e);
    if (onEndCallback) onEndCallback();
  };
  
  synth.speak(utterance);
}

async function startMicOnce() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    startSpeechRec();
    return;
  }
  
  // FALLBACK to MediaRecorder
  if (!navigator.mediaDevices) {
    alert("Microphone or Speech Recognition not supported in this browser.");
    return;
  }

  await ensureLogin();

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mediaRecorder = new MediaRecorder(stream);
    let audioChunks = [];

    mediaRecorder.ondataavailable = event => {
      audioChunks.push(event.data);
    };

    mediaRecorder.onstop = async () => {
      const audioBlob = new Blob(audioChunks, { type: "audio/wav" });
      const formData = new FormData();
      formData.append("file", audioBlob, "recording.wav");

      const typing = document.createElement("div");
      typing.className = "typing";
      typing.innerText = "Krishna is listening…";
      chat.appendChild(typing);

      try {
        const response = await fetch(API_BASE + "/voice/chat", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + getAccessToken()
          },
          body: formData
        });

        typing.remove();

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          showVoiceError(errData.error || "Voice request failed.");
          return;
        }

        const data = await response.json();
        
        if (data.text) {
          addAIMessage(data.text);
          
          if (data.audio_url) {
            const audio = new Audio(data.audio_url);
            audio.play();
            audio.onended = () => {
              if (liveMode) startMicOnce();
            };
          } else {
            speakWisdom(data.text, () => {
              if (liveMode) startMicOnce();
            });
          }
        }
      } catch (error) {
        typing.remove();
        showVoiceError("Voice connection failed. Check server status.");
        console.error("Voice error:", error);
      }
    };

    mediaRecorder.start();

    setTimeout(() => {
      if (mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        stream.getTracks().forEach(track => track.stop());
      }
    }, 8000);
  } catch (err) {
    showVoiceError("Microphone access denied.");
    console.error(err);
  }
}
</script>

  const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
  const wsUrl = `${protocol}//${window.location.host}/chat/live?token=${getAccessToken()}`;

  }

}
